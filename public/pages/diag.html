        // Test Provider
        async function testProvider() {
            const provider = document.getElementById('testProvider').value;
            const settings = JSON.parse(localStorage.getItem('apiSettings')) || {};
            const result = addResult('providerTests', `Testing ${provider} provider...`);
            
            try {
                // Check if server has API keys
                const serverKeysResponse = await fetch('/api/has-api-keys');
                const { claude: serverClaude, google: serverGoogle } = await serverKeysResponse.json();

                const headers = {
                    'Content-Type': 'application/json'
                };

                // Only add API key header if user has configured one (server will use its key if available)
                if (provider === 'google' && settings.googleApiKey) {
                    headers['X-API-Key'] = settings.googleApiKey;
                } else if (['claude', 'haiku', 'sonnet'].includes(provider) && settings.claudeApiKey) {
                    headers['X-API-Key'] = settings.claudeApiKey;
                }

                // Check if we have either user key or server key
                const hasKey = (provider === 'google' && (settings.googleApiKey || serverGoogle)) ||
                             (['claude', 'haiku', 'sonnet'].includes(provider) && (settings.claudeApiKey || serverClaude));
                
                if (!hasKey) {
                    throw new Error('No API key configured (neither user nor server)');
                }

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        message: 'Hello, this is a test message.',
                        captions: 'This is a test caption.',
                        provider
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Provider test failed');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let finalResponse = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            if (data.type === 'final') {
                                finalResponse = data;
                            }
                        }
                    }
                }

                if (finalResponse) {
                    updateResult(result, `
                        <div class="notification is-success is-light">
                            <p class="mb-2">✅ ${provider} test successful</p>
                            <pre class="has-background-white p-3">${finalResponse.markdown || finalResponse.html}</pre>
                        </div>
                    `, 'success');
                    log(`${provider} test successful`, 'success');
                } else {
                    throw new Error('No final response received');
                }
            } catch (error) {
                log(`${provider} test failed: ${error.message}`, 'danger');
                updateResult(result, `
                    <div class="notification is-danger is-light">
                        ❌ ${provider} test failed: ${error.message}
                    </div>
                `, 'error');
            }
        }

            return match ? match[1] : null;

                        headers: Array.from(navigateResponse.headers.entries())

                        type: headResponse.type,

                    }

                console.log('Fetch Results:', fetchResults);
                
                if (!fetchHtml.includes('captionTracks')) {

        function addResult(containerId, message, type = 'pending') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `notification is-info is-light`;
            div.innerHTML = message;
            container.insertBefore(div, container.firstChild);
            return div;
        }

        function updateResult(element, message, type) {
            element.innerHTML = message;
        }

        // Initialize on page load
        window.onload = () => {
            showEnvironmentInfo();
            updateProviderStatus();
            document.getElementById('videoUrl').value = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
            log('Diagnostic page initialized', 'info');
        };
    </script>
