<div class="container is-max-desktop">
    <h1 class="title is-2 has-text-centered mb-6" data-translate="title">YouTube Video Summarizer</h1>
    
    <div class="box">
        <div class="field">
            <div class="control">
                <input type="url" id="youtubeUrl" class="input is-medium" data-translate="urlPlaceholder" placeholder="Enter YouTube URL" required>
            </div>
        </div>

        <div class="field is-grouped is-grouped-multiline mt-4">
            <div class="control">
                <button id="settingsBtnHome" class="button is-link is-light" aria-label="Settings" data-translate="buttons.settings">
                    <span class="icon"><i class="fas fa-cog"></i></span>
                    <span>Settings</span>
                </button>
            </div>
            <div class="control is-expanded">
                <div class="select is-fullwidth">
                    <select id="captionLanguage" aria-label="Select Caption Language">
                        <option value="ar">Arabic</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="fa">Farsi / فارسی</option>
                        <option value="de">German</option>
                        <option value="hi">Hindi</option>
                        <option value="id">Indonesian</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="ms">Malay</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="th">Thai</option>
                        <option value="tr">Turkish</option>
                        <option value="vi">Vietnamese</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="field mt-3">
            <div class="control">
                <label class="checkbox">
                    <input type="checkbox" id="allowAutoGenerated" checked>
                    <span data-translate="allowAutoGenerated">Allow auto-generated captions</span>
                </label>
            </div>
        </div>

        <div class="field mt-4">
            <div class="buttons">
                <button id="submitBtn" class="button is-primary" style="flex: 1;" data-translate="buttons.submit">Get Captions</button>
                <button id="subtitleBtn" class="button is-warning" style="flex: 1;" data-translate="buttons.subtitles">
                    <span class="icon"><i class="fas fa-closed-captioning"></i></span>
                    <span>Get Subtitles</span>
                </button>
                <button onclick="showDownloadLinks()" id="downloadBtn" class="button is-success" style="flex: 1;" data-translate="buttons.download">
                    <span class="icon"><i class="fas fa-download"></i></span>
                    <span>Download</span>
                </button>
            </div>
        </div>
    </div>

    <div id="loading" class="notification is-info is-light has-text-centered is-hidden" data-translate="processingCaptions">
        Processing video captions...
    </div>

    <div id="error" class="notification is-danger is-light is-hidden"></div>
    <div id="status" class="notification is-info is-light is-hidden"></div>

    <div id="captionsContent" class="box content is-hidden has-background-white-ter"></div>

    <!-- Video Player (hidden until video is loaded) -->
    <div id="videoPlayerContainer" class="is-hidden" style="margin-top: 1rem;">
        <div class="box" style="padding: 0; overflow: hidden; border-radius: 8px;">
            <div id="videoPlayerWrapper" style="position: relative; width: 100%; padding-top: 56.25%;">
                <div id="videoPlayer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
                <div id="subtitleOverlay" style="position: absolute; bottom: 10%; left: 5%; right: 5%; text-align: center; pointer-events: none; z-index: 10;">
                    <span id="subtitleText" style="
                        display: inline-block;
                        background: rgba(0,0,0,0.75);
                        color: white;
                        font-size: clamp(14px, 2.5vw, 24px);
                        padding: 4px 12px;
                        border-radius: 4px;
                        line-height: 1.4;
                        max-width: 90%;
                        text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
                        direction: auto;
                    "></span>
                </div>
            </div>
        </div>
        <div class="buttons are-small mt-2" style="justify-content: center; align-items: center; gap: 0.5rem;">
            <button id="toggleSubsBtn" class="button is-small is-info is-light" title="Toggle subtitles">
                <span class="icon is-small"><i class="fas fa-closed-captioning"></i></span>
                <span>CC</span>
            </button>
            <div class="select is-small">
                <select id="subtitleLangSelect" title="Subtitle language">
                    <option value="">No subtitles</option>
                </select>
            </div>
            <button id="loadVideoBtn" class="button is-small is-light" title="Load in player">
                <span class="icon is-small"><i class="fas fa-play-circle"></i></span>
                <span>Load Video</span>
            </button>
            <button id="manageSubsBtn" class="button is-small is-light" title="Manage cached subtitles">
                <span class="icon is-small"><i class="fas fa-cog"></i></span>
            </button>
        </div>
    </div>

    <!-- Chat Container -->
    <div id="chatContainer" class="chat-container mt-5">
        <!-- Chat Header / Toolbar -->
        <div class="chat-header">
            <div class="chat-header-left">
                <span id="chatProviderBadge" class="chat-provider-badge is-hidden">
                    <span class="icon is-small"><i class="fas fa-robot"></i></span>
                    <span id="chatProviderName">AI</span>
                </span>
            </div>
            <div class="chat-header-right">
                <div class="buttons are-small">
                    <button id="historyBtn" class="button is-small is-info is-light" onclick="showHistoryPanel()" title="History">
                        <span class="icon is-small"><i class="fas fa-history"></i></span>
                        <span class="is-hidden-mobile" data-translate="chat.history">History</span>
                    </button>
                    <button id="exportChatBtn" class="button is-small is-light is-hidden" onclick="exportConversation()" title="Export">
                        <span class="icon is-small"><i class="fas fa-file-export"></i></span>
                        <span class="is-hidden-mobile" data-translate="chat.export">Export</span>
                    </button>
                    <button id="copyAllBtn" class="button is-small is-light" title="Copy All">
                        <span class="icon is-small"><i class="fas fa-copy"></i></span>
                        <span class="is-hidden-mobile" data-translate="chat.copyAll">Copy All</span>
                    </button>
                    <button id="clearChatBtn" class="button is-small is-danger is-light is-hidden" onclick="clearChat()" title="Clear Chat">
                        <span class="icon is-small"><i class="fas fa-trash-alt"></i></span>
                        <span class="is-hidden-mobile" data-translate="chat.clear">Clear</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div id="chatResponse" class="mt-2">
            <!-- Empty State -->
            <div id="chatEmptyState" class="chat-empty-state">
                <div class="chat-empty-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <p class="chat-empty-title" data-translate="chat.emptyTitle">Start a conversation</p>
                <p class="chat-empty-subtitle" data-translate="chat.emptySubtitle">Load a video and ask questions about it</p>
            </div>
            <div class="box chat-messages is-hidden"></div>
        </div>

        <!-- Chat Input Area -->
        <form id="chatForm" class="chat-input-container">
            <div class="chat-input-wrapper">
                <div class="control is-expanded">
                    <textarea id="chatInput" class="textarea chat-input" data-translate="chatPlaceholder" placeholder="Type your message..." rows="1"></textarea>
                </div>
                <div class="chat-input-actions">
                    <button type="button" id="stopBtn" class="button is-danger is-light is-hidden" title="Stop generating" aria-label="Stop generating" onclick="stopGeneration()">
                        <span class="icon">
                            <i class="fas fa-stop"></i>
                        </span>
                    </button>
                    <button type="submit" id="sendBtn" class="button is-primary" aria-label="Send Message">
                        <span class="icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </button>
                </div>
            </div>
            <div class="chat-input-footer">
                <p class="chat-input-hint" data-translate="chat.sendHint">Enter to send · Shift+Enter for a new line</p>
                <span id="chatCharCount" class="chat-char-count" aria-live="polite">0</span>
            </div>
        </form>
    </div>

    <div id="debug" class="box mt-6 is-hidden"></div>
</div>
