<div class="container is-max-desktop">
    <h1 class="title is-2 has-text-centered mb-6" data-translate="title">YouTube Video Summarizer</h1>
    
    <div class="box">
        <div class="field">
            <div class="control">
                <input type="url" id="youtubeUrl" class="input is-medium" data-translate="urlPlaceholder" placeholder="Enter YouTube URL" required>
            </div>
        </div>

        <div class="field is-grouped is-grouped-multiline mt-4">
            <div class="control">
                <button id="settingsBtn" class="button is-link is-light" aria-label="Settings">
                    <span class="icon"><i class="fas fa-cog"></i></span>
                    <span>Settings</span>
                </button>
            </div>
            <div class="control is-expanded">
                <div class="select is-fullwidth">
                    <select id="captionLanguage" aria-label="Select Caption Language">
                        <option value="ar">Arabic</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="hi">Hindi</option>
                        <option value="id">Indonesian</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="ms">Malay</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="th">Thai</option>
                        <option value="tr">Turkish</option>
                        <option value="vi">Vietnamese</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="field mt-3">
            <div class="control">
                <label class="checkbox">
                    <input type="checkbox" id="allowAutoGenerated" checked>
                    <span data-translate="allowAutoGenerated">Allow auto-generated captions</span>
                </label>
            </div>
        </div>

        <div class="field mt-4">
            <div class="buttons">
                <button onclick="handleSubmit()" id="submitBtn" class="button is-primary is-expanded" data-translate="buttons.submit">Get Captions</button>
                <button onclick="showDownloadLinks()" id="downloadBtn" class="button is-success is-expanded">
                    <span class="icon"><i class="fas fa-download"></i></span>
                    <span>Download</span>
                </button>
            </div>
        </div>
    </div>

    <div id="loading" class="notification is-info is-light has-text-centered is-hidden" data-translate="processingCaptions">
        Processing video captions...
    </div>

    <div id="error" class="notification is-danger is-light is-hidden"></div>
    <div id="status" class="notification is-info is-light is-hidden"></div>

    <div id="captionsContent" class="box content is-hidden has-background-white-ter"></div>

    <div id="chatResponse" class="mt-6">
        <div class="level mb-2">
            <div class="level-left"></div>
            <div class="level-right">
                <div class="buttons">
                    <button id="historyBtn" class="button is-small is-info is-light" onclick="showHistoryPanel()">
                        <span class="icon is-small"><i class="fas fa-history"></i></span>
                        <span>History</span>
                    </button>
                    <button id="copyAllBtn" class="button is-small is-light">
                        <span class="icon is-small"><i class="fas fa-copy"></i></span>
                        <span>Copy All</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="box chat-messages"></div>
    </div>

    <form id="chatForm" class="chat-input-container box mt-5">
        <div class="field has-addons">
            <div class="control is-expanded">
                <input type="text" id="chatInput" class="input" data-translate="chatPlaceholder" placeholder="Type your message...">
            </div>
            <div class="control">
                <button type="submit" id="sendBtn" class="button is-primary" aria-label="Send Message">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </form>

    <div id="debug" class="box mt-6 is-hidden"></div>
</div>
